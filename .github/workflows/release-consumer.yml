name: Release Consumer

# Drive scripts/release.py and build a tiny downstream consumer
# (scripts/release-consumer) against the staged `./release` directory.
# Exercises the install path the official release tarballs use, so changes
# to install rules, exported include paths, or camadaTargets.cmake stop
# breaking downstream builds silently. The subproject job builds Camada inside
# a consumer with add_subdirectory instead (scripts/subproject-consumer), which
# catches paths that only hold when Camada is the top-level project, and runs
# the regression suite against the in-tree target. Homebrew's Z3 is new enough,
# so no solver is built from source there.
on:
  push:
    branches:
    - master
    - release/*
  pull_request:
    branches:
    - master

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: Linux release consumer (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake linux-libc-dev meson ninja-build gperf doxygen pkg-config libgmp-dev libmpfr-dev python3

    - name: Generate release
      run: python3 ./scripts/release.py

    - name: Configure consumer
      run: cmake -S scripts/release-consumer -B scripts/release-consumer/build -GNinja -DCMAKE_PREFIX_PATH=$PWD/release

    - name: Build consumer
      run: cmake --build scripts/release-consumer/build

    - name: Run consumer
      run: ctest --test-dir scripts/release-consumer/build --parallel 4 --output-on-failure

  windows:
    name: Windows release consumer
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Generate release
      shell: pwsh
      run: python ./scripts/release.py

    - name: Configure consumer
      shell: pwsh
      run: cmake -S scripts/release-consumer -B scripts/release-consumer/build "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/release"

    - name: Build consumer
      shell: pwsh
      run: cmake --build scripts/release-consumer/build --config Release

    - name: Run consumer
      shell: pwsh
      run: ctest --test-dir scripts/release-consumer/build -C Release --parallel 4 --output-on-failure

  macos:
    name: macOS release consumer
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      # mpfr is needed because Bitwuzla's FP backend calls mpfr_* directly
      # and scripts/release.py adds -lmpfr to the install's link interface.
      run: brew install gmp mpfr cmake meson ninja automake boost zlib bison flex doxygen libtool pkg-config gettext texinfo python3

    - name: Configure Homebrew Environment
      run: |
        echo "CPPFLAGS=-I$(brew --prefix gmp)/include" >> $GITHUB_ENV
        echo "LDFLAGS=-L$(brew --prefix gmp)/lib" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=$(brew --prefix gmp)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig" >> $GITHUB_ENV

    - name: Generate release
      run: python3 ./scripts/release.py

    - name: Configure consumer
      # `-L$(brew --prefix)/lib` makes -lgmp / -lmpfr resolvable: Homebrew
      # libs are not on the linker's default search path on macOS.
      run: cmake -S scripts/release-consumer -B scripts/release-consumer/build -GNinja -DCMAKE_PREFIX_PATH=$PWD/release -DCMAKE_EXE_LINKER_FLAGS="-L$(brew --prefix)/lib"

    - name: Build consumer
      run: cmake --build scripts/release-consumer/build

    - name: Run consumer
      run: ctest --test-dir scripts/release-consumer/build --parallel 4 --output-on-failure

  subproject:
    name: macOS subproject consumer
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: brew install catch2 cmake ninja z3

    - name: Configure consumer
      run: >
        cmake -S scripts/subproject-consumer -B scripts/subproject-consumer/build -GNinja
        -DCAMADA_ENABLE_REGRESSION=ON
        -DCAMADA_DOWNLOAD_DEPENDENCIES=OFF
        -DCAMADA_SOLVER_Z3_ENABLE=ON
        -DCAMADA_SOLVER_BITWUZLA_ENABLE=OFF -DCAMADA_SOLVER_CVC5_ENABLE=OFF
        -DCAMADA_SOLVER_MATHSAT_ENABLE=OFF -DCAMADA_SOLVER_STP_ENABLE=OFF
        -DCAMADA_SOLVER_YICES_ENABLE=OFF
        -DENABLE_WERROR=ON

    - name: Build consumer
      run: cmake --build scripts/subproject-consumer/build

    - name: Run consumer
      run: ctest --test-dir scripts/subproject-consumer/build --parallel 4 --output-on-failure
