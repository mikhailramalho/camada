name: Linux Build
on:
  push:
    branches:
    - master
    - release/*
  pull_request:
    branches:
    - master

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y catch2 cmake linux-libc-dev meson ninja-build gperf doxygen pkg-config libgmp-dev libmpfr-dev

      # Setup/cache dependencies
    - name: Cache deps
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: |
          build/deps
          build/_deps
        key: ${{ runner.os }}-deps-${{ hashFiles('scripts/cmake/CamadaDependencies.cmake') }}
        # No prefix fallback: an exact-key miss rebuilds every dependency from
        # scratch. The fallback used to restore the newest previous tree, but a
        # restored tree satisfies find_package and the minimum-version floor, so
        # a recipe change underneath it went unnoticed and the stale build was
        # linked instead.

    - name: Configure Camada
      run: cmake -S . -B build -GNinja -DCAMADA_ENABLE_REGRESSION=ON -DBUILD_SHARED_LIBS=OFF -DCAMADA_DOWNLOAD_DEPENDENCIES=ALL -DCAMADA_SOLVER_BITWUZLA_ENABLE=ON -DCAMADA_SOLVER_CVC5_ENABLE=ON -DCAMADA_SOLVER_MATHSAT_ENABLE=ON -DCAMADA_SOLVER_STP_ENABLE=ON -DCAMADA_SOLVER_YICES_ENABLE=ON -DCAMADA_SOLVER_Z3_ENABLE=ON -DENABLE_WARNINGS=ON -DENABLE_WERROR=ON -DCMAKE_INSTALL_PREFIX:PATH=$GITHUB_WORKSPACE/release -DCMAKE_BUILD_TYPE=Debug

    - name: Build Camada
      run: cmake --build build --target install

    # This leg links every backend statically, which is the only configuration
    # where two bundled copies of one SAT engine collide. It is invisible at
    # link time and the suite below does not reach the affected code path, so
    # check the archives directly.
    - name: Check for duplicate SAT engines
      run: ./scripts/check-duplicate-sat-engines.py --verbose build

    - name: Run tests
      run: ctest --test-dir build --parallel 4 --output-on-failure
